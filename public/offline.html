<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sem conexão — Lúmina</title>
    <meta name="theme-color" content="#064e3b" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        background: #f9f9f8;
        color: #1a1c1c;
        font-family:
          'Plus Jakarta Sans',
          -apple-system,
          system-ui,
          sans-serif;
      }

      .mark {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #064e3b;
        display: grid;
        place-items: center;
        box-shadow: 0 12px 28px -10px rgba(6, 78, 59, 0.5);
      }

      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 26px;
        font-weight: 600;
        color: #003527;
      }

      p {
        max-width: 320px;
        font-size: 15px;
        line-height: 1.6;
        color: #404944;
      }

      button {
        margin-top: 6px;
        height: 48px;
        padding: 0 28px;
        border: none;
        border-radius: 9999px;
        background: #064e3b;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.98);
      }

      .hint {
        font-size: 12px;
        color: #707974;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg
        viewBox="0 0 120 120"
        width="46"
        height="46"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M60 34v50M60 84c-7-4.5-19-5.4-28-2V39c9-3.4 21-2.5 28 2M60 84c7-4.5 19-5.4 28-2V39c-9-3.4-21-2.5-28 2"
          stroke="#F59E0B"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="60" cy="26" r="3.5" fill="#FDE68A" />
        <path
          d="M60 14v3M67 21l-2.5 1.5M53 21l2.5 1.5"
          stroke="#FDE68A"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <h1>Você está sem conexão</h1>
    <p>
      Seus resumos salvos continuam disponíveis. Reconecte-se para baixar novos
      títulos e sincronizar seu progresso.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
    <span class="hint">Lúmina · 15 minutos de sabedoria por dia</span>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #064e3b;
        display: grid;
        place-items: center;
        position: relative;
      }

      body::after {
        content: '';
        position: absolute;
        width: 70%;
        height: 70%;
        border-radius: 9999px;
        background: radial-gradient(
          circle,
          rgba(254, 147, 44, 0.28),
          rgba(254, 147, 44, 0)
        );
      }

      svg {
        position: relative;
        z-index: 1;
        width: 62%;
        height: auto;
      }

      body.maskable svg {
        width: 46%;
      }
    </style>
    <script>
      if (location.hash === '#maskable') {
        document.body.classList.add('maskable')
      }
    </script>
  </head>
  <body>
    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M60 30V86M60 86C52 81 38 80 28 84V35C38 31 52 32 60 38M60 86C68 81 82 80 92 84V35C82 31 68 32 60 38"
        stroke="#F59E0B"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="60" cy="24" r="3.5" fill="#FDE68A" />
      <path
        d="M60 14V17M67 21L64.5 22.5M53 21L55.5 22.5"
        stroke="#FDE68A"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </body>
</html>
